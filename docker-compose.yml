services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pldhe-postgis
    environment:
      POSTGRES_USER: pldhe
      POSTGRES_PASSWORD: pldhe_secret
      POSTGRES_DB: pldhe
    ports:
      - "5432:5432"
    volumes:
      - pldhe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pldhe -d pldhe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pldhe-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pldhe:pldhe_secret@db:5432/pldhe
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/pldhe-helpline-dispatch}
      HELPLINE_NUMBER: ${HELPLINE_NUMBER:-0800-78643}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - pldhe_audio:/app/audio_storage

  n8n:
    image: n8nio/n8n:latest
    container_name: pldhe-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: pldhe_n8n
      WEBHOOK_URL: http://localhost:5678
    volumes:
      - pldhe_n8n:/home/node/.n8n
    depends_on:
      - backend

volumes:
  pldhe_pgdata:
  pldhe_audio:
  pldhe_n8n:
